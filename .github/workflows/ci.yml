name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://mediavault:mediavault@localhost:5432/mediavault_test
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: mediavault-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The app role must not be a superuser, or row-level security is silently bypassed.
      - name: Create non-superuser database role
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f infra/postgres-init.sql

      - name: Start MinIO (S3-compatible storage)
        run: |
          docker run -d --name minio -p 9000:9000 minio/minio server /data
          for i in $(seq 1 30); do curl -sf localhost:9000/minio/health/ready && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb local/mediavault-test"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t mediavault-api .

# Full local stack: Postgres, MinIO (S3-compatible storage), API and a separate media worker.
#   docker compose up --build        then run the web app with `npm run dev -w @mediavault/web`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: ['./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mediavault
      MINIO_ROOT_PASSWORD: mediavault-secret
    ports: ['9000:9000', '9001:9001']

  # Creates the bucket and allows browser uploads from the dev web origin.
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 mediavault mediavault-secret; do sleep 1; done;
             mc mb --ignore-existing local/mediavault"

  api: &api
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: &env
      DATABASE_URL: postgres://mediavault:mediavault@localhost:5432/mediavault
      APP_ORIGIN: http://localhost:5174
      PUBLIC_API_URL: http://localhost:5174/api
      SIGNING_SECRET: local-docker-signing-secret-not-for-production
      STORAGE_DRIVER: s3
      S3_BUCKET: mediavault
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: mediavault
      S3_SECRET_ACCESS_KEY: mediavault-secret
      RUN_WORKER_IN_PROCESS: 'false'
      NODE_ENV: development
    # Host networking so signed storage URLs (localhost:9000) work for both the API and your browser.
    network_mode: host
    depends_on:
      postgres: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }

  worker:
    <<: *api
    command: ['node', 'dist/worker.js']
